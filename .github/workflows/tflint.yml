name: tflint
on:
  workflow_call:
    inputs:
      tflint_version:
        description: TFLint version; empty uses the latest release
        required: false
        type: string
        default: ""

jobs:
  tflint:
    # Feature-branch pushes are covered by the pull_request run; only run push CI on the default branch.
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        name: Checkout source code

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        name: Cache plugin dir
        with:
          path: ~/.tflint.d/plugins
          key: tflint-${{ hashFiles('.tflint.hcl') }}

      - uses: terraform-linters/setup-tflint@7cf6558386ea02736c0a5edd3031f39c2dfeb206 # v1
        name: Setup TFLint
        with:
          tflint_version: ${{ inputs.tflint_version || 'latest' }}
          github_token: ${{ github.token }}

      - name: Show version
        run: tflint --version

      - name: Init TFLint
        run: tflint --init
        env:
          # Authenticated plugin downloads; anonymous GitHub API calls from
          # shared runner IPs regularly hit the 60/hr rate limit.
          GITHUB_TOKEN: ${{ github.token }}

      - name: Run TFLint
        run: tflint -f compact
