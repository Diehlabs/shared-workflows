name: terrascan
on:
  workflow_call:
    inputs:
      directory:
        required: false
        type: string
        # terrascan-action runs in a container with the workspace as cwd;
        # runner paths like github.workspace don't exist inside it
        default: "."

jobs:
  terrascan:
    # Feature-branch pushes are covered by the pull_request run; only run push CI on the default branch.
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    name: terrascan-action
    permissions:
      contents: read
      security-events: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # https://github.com/marketplace/actions/terrascan-iac-scanner
    - name: Run Terrascan
      id: terrascan
      uses: accurics/terrascan-action@a4b0f7ec5fb3c4c66b8e76d824d958002f6ce12c # main
      with:
        iac_type: 'terraform'
        iac_version: 'v14'
        policy_type: 'azure'
        only_warn: true
        verbose: true
        sarif_upload: true
        #non_recursive:
        iac_dir: ${{ inputs.directory }}
        #policy_path:
        #skip_rules:
        #config_path:
        #find_vulnerabilities:

    - name: Upload SARIF file
      uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
      with:
        sarif_file: terrascan.sarif
