name: terratest
on:
  workflow_dispatch: # leave this here so other repos can run manually?
  workflow_call:
    inputs:
      timeout:
        required: false
        type: string
        default: 15m
      terraform_version:
        required: true
        type: string
      working_directory:
        description: Directory containing the Go tests and go.mod
        required: false
        type: string
        default: test
      go_version:
        description: Go version override; empty reads it from <working_directory>/go.mod
        required: false
        type: string
        default: ""
    secrets:
      TE_APPROLE_ID:
        required: false
      TE_SECRET_ID:
        required: false
      ARM_CLIENT_ID:
         required: false
      ARM_CLIENT_SECRET:
         required: false
      ARM_TENANT_ID:
         required: false
      ARM_SUBSCRIPTION_ID:
         required: false

jobs:
  terratest:
    # Feature-branch pushes are covered by the pull_request run; only run push CI on the default branch.
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    name: terratest-action
    permissions:
      contents: read
      checks: write
    env:
      TF_CLI_ARGS: -no-color
      TERRAFORM_VERSION: ${{ inputs.terraform_version }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    # - uses: hashicorp/setup-terraform@v2
    #   with:
    #     terraform_wrapper: false
    #     terraform_version: ${{ env.TERRAFORM_VERSION }}
    - name: download-terraform
      run: |
        if [ -n "$TERRAFORM_VERSION" ]; then
            echo "TERRAFORM_VERSION variable is set: ${TERRAFORM_VERSION}"
            echo "This repository requires Terraform version ${TERRAFORM_VERSION}"
        else
            err_msg=" variable is not set!"
            echo "You MUST include a TERRAFORM_VERSION variable in this pipeline!"
            echo "${err_msg}"
            exit 1
        fi

        TF_DL_URL="https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip"

        echo "Terraform CLI version download URL:"
        echo "${TF_DL_URL}"

        MY_OUTPUT=$(curl \
        --request GET \
        -o "${RUNNER_TEMP}/terraform.zip" \
        "${TF_DL_URL}")

        echo "$MY_OUTPUT" | jq -C .

        cd "$RUNNER_TEMP"
        unzip ./terraform.zip &&\
        chmod +x ./terraform
        echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ inputs.go_version }}
        go-version-file: ${{ inputs.working_directory }}/go.mod
        cache-dependency-path: ${{ inputs.working_directory }}/go.sum

    - name: Execute Terratest
      working-directory: ${{ inputs.working_directory }}
      run: |
        printenv | sort
        go test -v -timeout ${{ inputs.timeout }} | tee ${{ runner.temp }}/test_output.log
        # capture immediately; any later command resets PIPESTATUS
        rc=${PIPESTATUS[0]}
        echo "go test exit code: ${rc}"
        exit "${rc}"
      env:
        ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
        ARM_CLIENT_SECRET:  ${{ secrets.ARM_CLIENT_SECRET }}
        ARM_TENANT_ID:  ${{ secrets.ARM_TENANT_ID }}
        ARM_SUBSCRIPTION_ID:  ${{ secrets.ARM_SUBSCRIPTION_ID }}

    - name: Generate Test Results
      if: always()
      run: |
        echo "Download Terratest Log Parser - START"
        # pinned: terratest's "latest" release is now a submodule tag with no binaries
        TLP_URL="https://github.com/gruntwork-io/terratest/releases/download/v1.0.1/terratest_log_parser_linux_amd64"
        curl \
          --silent \
          --location \
          --fail \
          --show-error \
          -o ${{ runner.temp }}/terratest_log_parser "$TLP_URL"
        chmod +x ${{ runner.temp }}/terratest_log_parser
        echo "Download Terratest Log Parser - END"

        echo "Generate JUnit report - START"
        ${{ runner.temp }}/terratest_log_parser -testlog ${{ runner.temp }}/test_output.log -outputdir test-results
        cat test-results/report.xml
        echo "Generate JUnit report - END"

    - name: Publish Unit Test Results
      uses: EnricoMi/publish-unit-test-result-action@7622c5bf3d112a72ab4fa3951c2aa5723d8ab92d # v2.25.0
      if: always()
      with:
        files: test-results/**/*.xml
        comment_mode: "off"
